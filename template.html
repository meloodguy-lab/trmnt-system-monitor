<link rel="stylesheet" href="https://usetrmnl.com">
<div class="layout layout--col gap--space-between">
  <div class="flex flex--row flex--center-y gap--medium">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
      <line x1="8" y1="21" x2="16" y2="21"></line>
      <line x1="12" y1="17" x2="12" y2="21"></line>
    </svg>
    <div class="flex flex--col">
      <span class="title">{{ hostname }}</span>
      <span class="label label--small">{{ OS }} | IP: {{ Loacal Ip }} | Up: {{ Uptime }}</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="grid grid--cols-2 gap--medium">
    <div class="item flex flex--row flex--center-y gap--small">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
        <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
        <rect x="9" y="9" width="6" height="6"></rect>
        <line x1="9" y1="1" x2="9" y2="4"></line>
        <line x1="15" y1="1" x2="15" y2="4"></line>
        <line x1="9" y1="20" x2="9" y2="23"></line>
        <line x1="15" y1="20" x2="15" y2="23"></line>
        <line x1="20" y1="9" x2="23" y2="9"></line>
        <line x1="20" y1="14" x2="23" y2="14"></line>
        <line x1="1" y1="9" x2="4" y2="9"></line>
        <line x1="1" y1="14" x2="4" y2="14"></line>
      </svg>
      <div class="content">
        <span class="label">CPU LOAD</span>
        <span class="value value--small">{{ CPU Load }}</span>
      </div>
    </div>

    <div class="item flex flex--row flex--center-y gap--small">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
        <path d="M6 12h.01M10 12h.01M14 12h.01M18 12h.01"></path>
        <path d="M6 18v2M10 18v2M14 18v2M18 18v2"></path>
      </svg>
      <div class="content">
        <span class="label">RAM USAGE</span>
        <span class="value value--small">{{ RAM Usage }}</span>
      </div>
    </div>

    <div class="item flex flex--row flex--center-y gap--small">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
        <line x1="22" y1="12" x2="2" y2="12"></line>
        <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
        <line x1="6" y1="16" x2="6.01" y2="16"></line>
        <line x1="10" y1="16" x2="10.01" y2="16"></line>
      </svg>
      <div class="content">
        <span class="label">DISK USAGE</span>
        <span class="value value--small">{{ Disk Usage }}</span>
      </div>
    </div>

    <div class="item flex flex--row flex--center-y gap--small">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
      </svg>
      <div class="content">
        <span class="label">TEMPERATURE</span>
        <span class="value value--small">{{ Temperature }}</span>
      </div>
    </div>
  </div>
</div>

<div class="title_bar">
  <span class="title">System Monitor</span>
  <span class="instance">Status: Online</span>
</div>
